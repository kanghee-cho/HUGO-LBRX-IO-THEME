{{ define "main" }}
<article
  data-pagefind-body
  data-pagefind-meta="title:{{ .Title }},section:{{ .Section }},language:{{ .Site.Language.Lang }}"
>
  <header class="mb-10" data-pagefind-ignore>
    <p class="text-sm text-olive-500 dark:text-olive-400 uppercase tracking-wider mb-2">
      {{- with .Params.edition_number -}}
        {{ i18n "edition_no" | default "Edition" }} #{{ . }} ·
      {{- end -}}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2006" }}</time>
    </p>
    <h1 class="font-sans text-2xl sm:text-4xl font-bold text-olive-900 dark:text-olive-100 leading-tight">{{ .Title }}</h1>
    {{- with .Description -}}
      <p class="mt-4 text-lg text-olive-600 dark:text-olive-400">{{ . }}</p>
    {{- end -}}
    {{- with .Params.cover -}}
      <div class="mt-6 aspect-video overflow-hidden rounded-xl sm:rounded-xl shadow-md -mx-4 sm:mx-0">
        <img src="{{ . }}" alt="{{ $.Title }} cover" class="w-full h-full object-cover" loading="lazy">
      </div>
    {{- end -}}
  </header>
  <div class="prose prose dark:prose-invert max-w-none">
    {{ .Content }}
  </div>
</article>
{{ end }}
