<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" class="h-full">
  <head>
    {{- partial "head.html" . -}}
  </head>
  <body class="h-full bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased transition-colors duration-200">
    {{- partial "header.html" . -}}
    <main id="main-content" class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-12">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
    {{- partial "search-modal.html" . -}}
    {{- $js := resources.Get "js/theme-toggle.js" | js.Build (dict "minify" hugo.IsProduction) -}}
    <script src="{{ $js.RelPermalink }}" defer></script>
  </body>
</html>
