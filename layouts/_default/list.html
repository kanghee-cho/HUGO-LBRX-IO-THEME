{{ define "main" }}
<section>
  <header class="mb-10">
    <h1 class="font-sans text-2xl sm:text-4xl font-bold text-brand-text dark:text-brand-text">
      {{ .Title }}
    </h1>
    {{- with .Description -}}
      <p class="mt-3 text-lg text-brand-accent dark:text-brand-muted">{{ . }}</p>
    {{- end -}}
  </header>
  <ul class="space-y-8">
    {{- range .Pages -}}
      <li>
        <article class="group">
          <a href="{{ .RelPermalink }}" class="block">
            <time class="text-sm text-brand-muted dark:text-brand-muted" datetime="{{ .Date.Format "2006-01-02" }}">
              {{ .Date.Format "2 January 2006" }}
            </time>
            <h2 class="mt-1 font-sans text-xl font-semibold text-brand-text dark:text-brand-text group-hover:text-brand-accent dark:group-hover:text-brand-accent transition-colors">
              {{ .Title }}
            </h2>
            {{- with .Summary -}}
              <p class="mt-2 text-brand-accent dark:text-brand-muted line-clamp-2">{{ . }}</p>
            {{- end -}}
          </a>
        </article>
      </li>
    {{- end -}}
  </ul>
</section>
{{ end }}
