{{ define "main" }}
<section>
  <header class="mb-10">
    <h1 class="font-serif text-4xl font-bold text-zinc-900 dark:text-zinc-100">
      {{ .Title }}
    </h1>
    {{- with .Description -}}
      <p class="mt-3 text-lg text-zinc-600 dark:text-zinc-400">{{ . }}</p>
    {{- end -}}
  </header>
  <ul class="space-y-8">
    {{- range .Pages -}}
      <li>
        <article class="group">
          <a href="{{ .RelPermalink }}" class="block">
            <time class="text-sm text-zinc-500 dark:text-zinc-400" datetime="{{ .Date.Format "2006-01-02" }}">
              {{ .Date.Format "2 January 2006" }}
            </time>
            <h2 class="mt-1 font-serif text-xl font-semibold text-zinc-900 dark:text-zinc-100 group-hover:text-zinc-600 dark:group-hover:text-zinc-300 transition-colors">
              {{ .Title }}
            </h2>
            {{- with .Summary -}}
              <p class="mt-2 text-zinc-600 dark:text-zinc-400 line-clamp-2">{{ . }}</p>
            {{- end -}}
          </a>
        </article>
      </li>
    {{- end -}}
  </ul>
</section>
{{ end }}
