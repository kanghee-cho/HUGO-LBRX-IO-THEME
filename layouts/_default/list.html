{{ define "main" }}
<section>
  <header class="mb-10">
    <h1 class="font-sans text-2xl sm:text-4xl font-bold text-olive-900 dark:text-olive-100">
      {{ .Title }}
    </h1>
    {{- with .Description -}}
      <p class="mt-3 text-lg text-olive-600 dark:text-olive-400">{{ . }}</p>
    {{- end -}}
  </header>
  <ul class="space-y-8">
    {{- range .Pages -}}
      <li>
        <article class="group">
          <a href="{{ .RelPermalink }}" class="block">
            <time class="text-sm text-olive-500 dark:text-olive-400" datetime="{{ .Date.Format "2006-01-02" }}">
              {{ .Date.Format "2 January 2006" }}
            </time>
            <h2 class="mt-1 font-sans text-xl font-semibold text-olive-900 dark:text-olive-100 group-hover:text-olive-600 dark:group-hover:text-olive-300 transition-colors">
              {{ .Title }}
            </h2>
            {{- with .Summary -}}
              <p class="mt-2 text-olive-600 dark:text-olive-400 line-clamp-2">{{ . }}</p>
            {{- end -}}
          </a>
        </article>
      </li>
    {{- end -}}
  </ul>
</section>
{{ end }}
