{{- /* Search modal — Pagefind JS API integration implemented in Feature #135 */}}
<div
  id="search-modal"
  class="hidden fixed inset-0 z-50"
  role="dialog"
  aria-modal="true"
  aria-label="{{ i18n "search" | default "Search" }}"
>
  <div id="search-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
  <div class="relative flex items-start justify-center min-h-screen pt-16 px-4">
    <div class="w-full max-w-2xl bg-white dark:bg-zinc-900 rounded-xl shadow-2xl overflow-hidden ring-1 ring-zinc-200 dark:ring-zinc-700">
      <div id="search-container" class="p-6">
        <p class="text-zinc-500 dark:text-zinc-400 text-sm text-center py-8">
          {{ i18n "search_unavailable" | default "Search is not available in development mode. Run `npm run build` first." }}
        </p>
      </div>
    </div>
  </div>
</div>
