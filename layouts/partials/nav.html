<nav class="hidden md:flex items-center gap-6 text-sm font-medium text-olive-600 dark:text-olive-400" aria-label="Main navigation">
  {{- $currentPage := . -}}
  {{- range .Site.Menus.main -}}
    <a
      href="{{ .URL | relLangURL }}"
      class="hover:text-olive-900 dark:hover:text-olive-100 transition-colors{{ if $currentPage.IsMenuCurrent "main" . }} text-olive-900 dark:text-olive-100 font-semibold{{ end }}"
      {{- if $currentPage.IsMenuCurrent "main" . }} aria-current="page"{{ end }}
    >
      {{ .Name }}
    </a>
  {{- end -}}
</nav>

{{- /* Mobile nav dropdown — controlled by nav.js via data-nav-menu */}}
<div
  id="mobile-nav"
  data-nav-menu
  hidden
  class="md:hidden absolute top-16 left-0 right-0 z-30 bg-white dark:bg-olive-950 border-b-2 border-olive-200 dark:border-olive-800 shadow-xl"
  aria-label="Mobile navigation"
>
  <nav class="flex flex-col py-2" aria-label="Mobile menu">
    {{- $currentPage := . -}}
    {{- range .Site.Menus.main -}}
      <a
        href="{{ .URL | relLangURL }}"
        class="flex items-center gap-3 px-6 py-4 text-base font-medium border-l-4 transition-colors
          {{- if $currentPage.IsMenuCurrent "main" . }}
            border-olive-500 text-olive-800 dark:text-olive-100 bg-olive-50 dark:bg-olive-900
          {{- else }}
            border-transparent text-olive-700 dark:text-olive-300 hover:border-olive-300 hover:bg-olive-50 dark:hover:bg-olive-900/50 hover:text-olive-900 dark:hover:text-olive-100
          {{- end }}"
        {{- if $currentPage.IsMenuCurrent "main" . }} aria-current="page"{{ end }}
      >
        {{ .Name }}
        {{- if $currentPage.IsMenuCurrent "main" . }}
          <span class="ml-auto w-1.5 h-1.5 rounded-full bg-olive-500" aria-hidden="true"></span>
        {{- end }}
      </a>
    {{- end -}}
  </nav>
</div>
