{{ define "main" }}
<div class="text-center py-24">
  <p class="font-sans text-8xl font-bold text-brand-muted dark:text-brand-muted select-none">404</p>
  <h1 class="mt-4 font-sans text-3xl font-bold text-brand-text dark:text-brand-text">
    {{ i18n "not_found_title" | default "Page not found" }}
  </h1>
  <p class="mt-4 text-brand-accent dark:text-brand-muted">
    {{ i18n "not_found_desc" | default "The page you're looking for doesn't exist or has been moved." }}
  </p>
  <a
    href="{{ "/" | relLangURL }}"
    class="mt-8 inline-block px-6 py-3 rounded-lg bg-brand-accent dark:bg-brand-accent text-brand-on-accent font-medium hover:bg-brand-accent dark:hover:bg-brand-accent transition-colors"
  >
    {{ i18n "go_home" | default "Go home" }}
  </a>
</div>
{{ end }}
