baseURL = "https://example.com/"
locale = "ko"
defaultContentLanguage = "ko"
title = "LBRX.IO"
theme = "hugo-lbrx-io-theme"

[pagination]
  pagerSize = 12

# Disable RSS for about section (set per-page via outputs front matter)
disableKinds = ["taxonomy", "term"]

[params]
  description = "책, 에디션, 그리고 픽션."
  nickname = "KH.CHO"
  github = "https://github.com/kanghee-cho"
  author = "LBRX"

[[params.social]]
  name = "github"
  url = "https://github.com/kanghee-cho"

[[params.social]]
  name = "email"
  url = "mailto:kh.cho@lbrx.io"

[[params.social]]
  name = "instagram"
  url = "https://instagram.com/kh.cho83"

[[params.social]]
  name = "linkedin"
  url = "https://linkedin.com/in/joedamon"

[languages]
  [languages.ko]
    label = "한국어"
    weight = 1
    contentDir = "content"
    [languages.ko.params]
      description = "책, 에디션, 그리고 픽션."
  [languages.en]
    label = "English"
    weight = 2
    contentDir = "content.en"
    [languages.en.params]
      description = "Books, editions, and fiction."

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[languages.ko.menus]
  [[languages.ko.menus.main]]
    name = "책장"
    url = "/shelf/"
    weight = 1
  [[languages.ko.menus.main]]
    name = "에디션"
    url = "/editions/"
    weight = 2
  [[languages.ko.menus.main]]
    name = "픽션"
    url = "/fiction/"
    weight = 3
  [[languages.ko.menus.main]]
    name = "소개"
    url = "/about/"
    weight = 4

[languages.en.menus]
  [[languages.en.menus.main]]
    name = "Shelf"
    url = "/shelf/"
    weight = 1
  [[languages.en.menus.main]]
    name = "Editions"
    url = "/editions/"
    weight = 2
  [[languages.en.menus.main]]
    name = "Fiction"
    url = "/fiction/"
    weight = 3
  [[languages.en.menus.main]]
    name = "About"
    url = "/about/"
    weight = 4
